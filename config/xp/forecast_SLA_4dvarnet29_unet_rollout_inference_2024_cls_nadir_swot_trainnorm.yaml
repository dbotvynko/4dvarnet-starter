# @package _global_
# copy of forecast_SLA_4dvarnet29_unet_rollout_inference_2024_cls_nadir_swot.yaml with the training normalisation
# 4DVarNet UNet roll-out inference, 2024 CLS nadir_swot: copy of forecast_SLA_4dvarnet29_notSSH_V2_inference_2024_cls_nadir_swot.yaml with the solver of forecast_SLA_4dvarnet29_unet_rollout_OSSE_Nadir.yaml
# 2024 CLS nadir_swot input for the 29-day 4DVarNet (Nadir OSSE): copy of forecast_SLA_4dvarnet_notSSH_V2_inference_2023.yaml with only the input file and year changed.
# 4DVarNet SLA (29-day window, 14 observed days + forecast, ckpt forecast_global_GPU_1patch_1y_SLA_not_SSH/val_mse=4.13586-epoch=299),
# 2023 re-inference of glorys4_global_1patch_SLA_not_SSH_V2 (its Feb 2025 forecasts are no longer on disk).
# Copy of base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA.yaml + the October 2025 SLA loader (the default one in data.py
# now reads SST inputs) and the keys that loader needs. Lead mapping: obs masked from index dT//2 = 14 (mask_batch),
# rec_weight_fn puts lead i at index dT//2 + i and the file is test_data_{i + (dT-1)//2} -> test_data_14 = first unobserved day (no shift).
ose_input_loader: contrib.swot_osse.ose_loader.load_ose_data_with_tgt_mask_SLA_2025
var_name: "sla_filtered"
year_ose: 2024

paths:
    masks_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle 
    glorys12_data: /Odyssey/public/glorys/reanalysis/glorys4_2010_2019_sla.nc
    ref_data_l4: ""
    ose_data_paths: /Odyssey/public/swot_traces/cls/gridded_obs_sla_0.25_swot_2024_reformated.nc
    ckpt_path: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_1y_SLA_not_SSH/base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA/checkpoints/val_mse=4.13586-epoch=299.ckpt
      #Odyssey/public/glorys/reanalysis/glorys12_2010_2019_4th.nc   # Path des trcaes L3 ?
      #kpt_path: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_1y_SLA_not_SSH/base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA/checkpoints/val_mse=5.06367-epoch=088.ckpt
      #al_mse=5.21636-epoch=057.ckpt

domain:
  train:
    lat:
      _target_: builtins.slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  test:
    lat:
      _target_: builtins.slice
      _args_:
      - -79
      - 89
    lon:
      _target_: builtins.slice
      _args_:
      - -179
      - 179

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_GPU_1patch_1y_SLA_from_chkpt_weight_250
      #${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 350
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU
  norm_stats: [-0.001197828445583582, 0.04447929561138153]  # training normalisation (GLORYS 2010-2019), instead of the DUACS reference map
  input_da: 
    _target_: contrib.data_loading.data.open_glorys12_data_sla
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    domain: ${domain.train}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2019-05-17']}
    val: 
      time: {_target_: builtins.slice, _args_: ['2019-05-18', '2019-12-31']}
    test: 
      time: {_target_: builtins.slice,  _args_: ['2019-12-31', '2019-12-31']}
  xrds_kw:
    patch_dims: { time: 29, lat: 680, lon: 1440}
    strides: { time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: True

model:
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  solver:
    # 4DVarNet "UNet roll-out" of ocean4dvarnet (branch 19-integrate-evolution-from-global-mapping): unrolled solver whose update at
    # each of n_step steps is predicted by a UNet conditioned on the step, fed with the normalised variational gradient and the state.
    _target_: contrib.ocean4dvarnet_rollout.solver.DiffusionGradSolver
    n_step: 5
    lr_grad: 0.2
    input_grad_update: grad+state
    std_init: 0.0            # deterministic start (zeros) for forecasting
    prior_cost:
      _target_: src.models.BilinAEPriorCost
      dim_in: ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 64
      bilin_quad: False
    obs_cost:
      _target_: src.models.BaseObsCost
    grad_mod:
      _target_: contrib.ocean4dvarnet_rollout.solver.GradModelWithCondition
      dropout: 0.0
      use_grad_norm: True
      grad_model:
        _target_: contrib.ocean4dvarnet_rollout.unet.UNetModel
        in_channels: 58          # grad + state: 2 x 29 days
        out_channels: ${datamodule.xrds_kw.patch_dims.time}
        model_channels: 32
        num_res_blocks: 2
        attention_resolutions: []   # no attention: the 680 x 1440 patch is too large for it
        channel_mult: [1, 2, 4, 8]
        dims: 2
        dropout: 0.0
        use_checkpoint: True     # recompute activations in the backward pass (memory of the unrolled steps)
  pre_metric_fn:
        _target_: xarray.Dataset.sel
        _partial_: True
        time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
        lat: ${domain.test.lat}
        lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_

