# @package _global_
# 4DVarNet UNet roll-out (contrib/ocean4dvarnet_rollout), 29-day forecast window, trained from scratch on the nadir + SWOT OSSE with the
# calibrated SWOT errors re-drawn every 10 epochs: copy of forecast_SLA_4dvarnet29_OSSE_SWOT_errors_scratch.yaml (4DVarNet-S: same data
# module, dates, epochs, model) with the solver replaced and a new save_dir. Launcher: scripts/slurm_swot_osse/train_SLA_4dvarnet29_unet_rollout.sh
# The launcher overrides paths.glorys12_data with the node-local /SCRATCH copy.

paths:
  glorys12_data: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_float32.nc
  masks_path: /Odyssey/public/swot_traces/mask/cls_2024_nadir_swot_masks.npz
  calibration: contrib/swot_osse/swot_errors_2024_calibrated.yaml

domain:
  train:
    lat: {_target_: builtins.slice, _args_: [-80, 90]}
    lon: {_target_: builtins.slice, _args_: [-180, 180]}
  test:
    lat: {_target_: builtins.slice, _args_: [-79, 89]}
    lon: {_target_: builtins.slice, _args_: [-179, 179]}

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  reload_dataloaders_every_n_epochs: ${datamodule.resample_every}
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_SLA_4dvarnet29_unet_rollout_OSSE_SWOT_errors
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 400
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      save_last: True
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.swot_osse.data_epoch.SwotErrorsMovingPatchDataModule
  osse_kw:
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    calibration: ${paths.calibration}
    domain: ${domain.train}
    swot_dropout: 0.5
    nadir_noise_m: 0.01
    scale_buckets_deg: [1.0, 1.5, 2.0]
    n_pool: 48
  resample_every: 10
  val_seed: 0
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2019-05-17']}
    val:
      time: {_target_: builtins.slice, _args_: ['2019-05-18', '2019-12-31']}
    test:
      time: {_target_: builtins.slice, _args_: ['2019-12-31', '2019-12-31']}
  xrds_kw:
    patch_dims: {time: 29, lat: 680, lon: 1440}
    strides: {time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 12}
  aug_kw: null

model:
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  solver:
    # 4DVarNet "UNet roll-out" of ocean4dvarnet (branch 19-integrate-evolution-from-global-mapping): unrolled solver whose update at
    # each of n_step steps is predicted by a UNet conditioned on the step, fed with the normalised variational gradient and the state.
    _target_: contrib.ocean4dvarnet_rollout.solver.DiffusionGradSolver
    n_step: 5
    lr_grad: 0.2
    input_grad_update: grad+state
    std_init: 0.0            # deterministic start (zeros) for forecasting
    prior_cost:
      _target_: src.models.BilinAEPriorCost
      dim_in: ${datamodule.xrds_kw.patch_dims.time}
      dim_hidden: 64
      bilin_quad: False
    obs_cost:
      _target_: src.models.BaseObsCost
    grad_mod:
      _target_: contrib.ocean4dvarnet_rollout.solver.GradModelWithCondition
      dropout: 0.0
      use_grad_norm: True
      grad_model:
        _target_: contrib.ocean4dvarnet_rollout.unet.UNetModel
        in_channels: 58          # grad + state: 2 x 29 days
        out_channels: ${datamodule.xrds_kw.patch_dims.time}
        model_channels: 32
        num_res_blocks: 2
        attention_resolutions: []   # no attention: the 680 x 1440 patch is too large for it
        channel_mult: [1, 2, 4, 8]
        dims: 2
        dropout: 0.0
        use_checkpoint: True     # recompute activations in the backward pass (memory of the unrolled steps)
  pre_metric_fn:
    _target_: xarray.Dataset.sel
    _partial_: True
    time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
    lat: ${domain.test.lat}
    lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_
