# @package _global_
# Copy of forecast_SLA_UNet_OSE_2017_2022_inference_2024_cls_nadir.yaml with norm_stats = the values the model was trained
# with ("Norm stats" of job_11377 / job_11438_SLA_real_data.log, August 2025), instead of the August 2025 inference values
# (0.0685, 0.0888). Used for the OSE UNet (control) and for its SWOT fine-tune, trained with the same values.
# Inference config of the OSE SLA UNet trained on 2017-2022 with the DUACS losses (checkpoint val_mse=0.01999-epoch=151),
# input: CLS nadir input 2024 (gridded_obs_sla_0.25_nadirs_2024_without_swon.nc).
# Copy of base_forecast_global_softedge_fastrec_GPU_1patch_10y_SLA_UNet_real_data_from_sratch.yaml as it was when the 2023
# forecasts were made (commit 5b5c485, 6 August 2025), with:
# - the August 2025 input loader (contrib/swot_osse/ose_loader_aug2025.py), year and CLS input as parameters;
# - glorys12_data: duacs_2017_2022_0.25deg.nc (duacs_2017_2022_4th.nc of August 2025 no longer exists; same 0.25deg grid);
# - norm_stats fixed to the values of the August 2025 inference: mean/std of the target map of the loader (DUACS 2019-01-20
#   interpolated on the NRT grid, lat -80..89.75), as computed by train_mean_std on the 2023 input
#   Recomputed on the CLS grid (lat -80..81.75) they would be (0.0724, 0.0908).
ose_input_loader: contrib.swot_osse.ose_loader_aug2025.load_ose_data_with_tgt_mask_SLA_aug2025

paths:
  masks_path: /Odyssey/public/glorys/obs_masks/global_obs_6sats_masks_2022.pickle
  glorys12_data: /Odyssey/public/duacs/2023/duacs_2017_2022_0.25deg.nc
  real_traces: /Odyssey/public/altimetry_traces/2010_2023/gridded/gridded_input.nc
  ref_data_l4: ""
  ose_data_paths: /Odyssey/public/swot_traces/cls/gridded_obs_sla_0.25_nadirs_2024_without_swon.nc

var_name: "sla_filtered"
year_ose: 2024

domain:
  train:
    lat:
      _target_: builtins.slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  test:
    lat:
      _target_: builtins.slice
      _args_:
      - -79
      - 89
    lon:
      _target_: builtins.slice
      _args_:
      - -179
      - 179

trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: False
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: /Odyssey/public/glorys/trainings/forecast_global_1patch_2017_2022_SLA_UNet_ResBlock_real_data_Nadir_Duacs_losses
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 350
  limit_train_batches: 100
  callbacks:
    - _target_: src.versioning_cb.VersioningCallback
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_mse
      save_top_k: 3
      filename: '{val_mse:.5f}-{epoch:03d}'

datamodule:
  _target_: contrib.moving_patches.movpatch_data_tests.MovingPatchDataModuleFastRecGPU
  norm_stats: [0.07341718673706055, 0.06454061716794968]  # (mean, std) in m of the August 2025 training, see header
  input_da: 
    _target_: contrib.data_loading.data.open_glorys12_data_sla_OSE
      #open_duacs_data_sla
    path: ${paths.glorys12_data}
    masks_path: ${paths.masks_path}
    real_traces: ${paths.real_traces}
    domain: ${domain.train}
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2017-01-01', '2022-04-17']}
    val: 
      time: {_target_: builtins.slice, _args_: ['2022-04-18', '2022-11-30']}
    test: 
      time: {_target_: builtins.slice,  _args_: ['2022-12-31', '2022-12-31']}
  xrds_kw:
    patch_dims: { time: 29, lat: 680, lon: 1440}
    strides: { time: 1, lat: 672, lon: 1432}
    domain_limits: ${domain.train}
  dl_kw: {batch_size: 1, num_workers: 4}
  aug_kw:
    aug_factor: 1
    aug_only: False # ATTENTION !!!!! CHANGED AUGMENTATION !!!!

model:
  _target_: contrib.forecast_plus.models.Plus4dVarNetForecastPatchGPU_UNet
  persist_rw: False
  opt_fn:
    _target_: src.utils.cosanneal_lr_adam_UNet            #cosanneal_lr_adam
    _partial_: true
    lr: 1e-3
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: src.utils.get_forecast_wei
    patch_dims: ${datamodule.xrds_kw.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  rec_weight_fn:
    _target_: contrib.forecast_weights.forecast_weights_reconstruction_soft_edges
    _partial_: True
    soft_edge: 0.25
  solver:
    _target_: src.models_UNet.UNet    #GradSolverZero
    n_channels: 29
    n_classes: 29
    bilinear: True
    block: 
      _target_: src.parts.ResBlock
      _partial_: True
    add_input: False
      #n_step: 10
      #lr_grad: 1e3
    # lr_grad: 0.2
    #prior_cost:
    # _target_: src.models.BilinAEPriorCost
    # dim_in: ${datamodule.xrds_kw.patch_dims.time}
    # dim_hidden: 64
    # bilin_quad: False
      # bilin_quad: True
      #downsamp: 2
    # obs_cost:
    #_target_: src.models.BaseObsCost
    #grad_mod:
    # _target_: src.models.ConvLstmGradModel
    # dim_in: ${datamodule.xrds_kw.patch_dims.time}
    # dim_hidden: 96
  pre_metric_fn:
        _target_: xarray.Dataset.sel
        _partial_: True
        time: {_target_: builtins.slice, _args_: ["2019-11-25", "2019-12-31"]}
        lat: ${domain.test.lat}
        lon: ${domain.test.lon}

entrypoints:
  - _target_: pytorch_lightning.seed_everything
    seed: 333
  - _target_: src.train.base_training
    trainer: ${trainer}
    lit_mod: ${model}
    dm: ${datamodule}

defaults:
  - _self_

